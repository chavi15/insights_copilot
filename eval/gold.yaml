- id: m10
  difficulty: medium
  question: Which territories had total revenue above 1,800,000 over the whole period, and which rep covers each?
  sql: |-
    SELECT t.territory_name, t.rep_name, ROUND(SUM(s.revenue), 2) AS total_revenue
    FROM fact_sales s
    JOIN dim_hcp h ON s.hcp_id = h.hcp_id
    JOIN dim_territory t ON h.territory_id = t.territory_id
    GROUP BY t.territory_name, t.rep_name
