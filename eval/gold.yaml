- id: m01
  difficulty: medium
  question: What was the total revenue for each product in 2025?
  sql: |-
    SELECT p.product_name, ROUND(SUM(s.revenue), 2) AS total_revenue
    FROM fact_sales s
    JOIN dim_product p ON s.product_id = p.product_id
    JOIN dim_date d ON s.date_id = d.date_id
    WHERE d.year = 2025
    GROUP BY p.product_name
    ORDER BY total_revenue DESC, p.product_name
- id: m02
  difficulty: medium
  question: What is the total revenue for each region?
  sql: |-
    SELECT t.region, ROUND(SUM(s.revenue), 2) AS total_revenue
    FROM fact_sales s
    JOIN dim_hcp h ON s.hcp_id = h.hcp_id
    JOIN dim_territory t ON h.territory_id = t.territory_id
    GROUP BY t.region
    ORDER BY t.region
- id: m03
  difficulty: medium
  question: Which therapeutic area generated the highest revenue in 2025?
  sql: |-
    SELECT p.therapeutic_area, ROUND(SUM(s.revenue), 2) AS total_revenue
    FROM fact_sales s
    JOIN dim_product p ON s.product_id = p.product_id
    JOIN dim_date d ON s.date_id = d.date_id
    WHERE d.year = 2025
    GROUP BY p.therapeutic_area
    ORDER BY total_revenue DESC, p.therapeutic_area
