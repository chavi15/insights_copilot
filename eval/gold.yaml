- id: h01
  difficulty: hard
  question: Show total revenue by month together with the change from the previous month.
  sql: |-
    WITH monthly AS (
      SELECT d.date_id, SUM(s.revenue) AS revenue
      FROM fact_sales s
      JOIN dim_date d ON s.date_id = d.date_id
      GROUP BY d.date_id
    )
    SELECT date_id, ROUND(revenue, 2) AS revenue, ROUND(revenue - LAG(revenue) OVER (ORDER BY date_id), 2) AS change_vs_prev_month
    FROM monthly
    ORDER BY date_id
- id: h02
  difficulty: hard
  question: Which territories missed their total target revenue in Q4 2025? Show actual revenue and target.
  sql: |-
    WITH actual AS (
      SELECT h.territory_id, s.product_id, s.date_id, SUM(s.revenue) AS actual_revenue
      FROM fact_sales s
      JOIN dim_hcp h ON s.hcp_id = h.hcp_id
      GROUP BY h.territory_id, s.product_id, s.date_id
    )
    SELECT t.territory_name, ROUND(SUM(a.actual_revenue), 2) AS actual_revenue, ROUND(SUM(g.target_revenue), 2) AS target_revenue
    FROM targets g
    JOIN actual a ON a.territory_id = g.territory_id AND a.product_id = g.product_id AND a.date_id = g.date_id
    JOIN dim_date d ON g.date_id = d.date_id
    JOIN dim_territory t ON g.territory_id = t.territory_id
    WHERE d.year = 2025 AND d.quarter = 4
    GROUP BY t.territory_name
    HAVING SUM(a.actual_revenue) < SUM(g.target_revenue)
    ORDER BY t.territory_name
- id: h03
  difficulty: hard
  question: What are the top 3 territories by total revenue within each region?
  sql: |-
    WITH rev AS (
      SELECT t.region, t.territory_name, SUM(s.revenue) AS total_revenue
      FROM fact_sales s
      JOIN dim_hcp h ON s.hcp_id = h.hcp_id
      JOIN dim_territory t ON h.territory_id = t.territory_id
      GROUP BY t.region, t.territory_name
    ), ranked AS (
      SELECT region, territory_name, total_revenue,
             ROW_NUMBER() OVER (PARTITION BY region ORDER BY total_revenue DESC, territory_name) AS rn
      FROM rev
    )
    SELECT region, territory_name, ROUND(total_revenue, 2) AS total_revenue
    FROM ranked
    WHERE rn <= 3
    ORDER BY region, rn
- id: h04
  difficulty: hard
  question: Show the running total of revenue by month for 2025.
  sql: |-
    WITH monthly AS (
      SELECT d.date_id, SUM(s.revenue) AS revenue
      FROM fact_sales s
      JOIN dim_date d ON s.date_id = d.date_id
      WHERE d.year = 2025
      GROUP BY d.date_id
    )
    SELECT date_id, ROUND(revenue, 2) AS revenue, ROUND(SUM(revenue) OVER (ORDER BY date_id), 2) AS running_total
    FROM monthly
    ORDER BY date_id
- id: h05
  difficulty: hard
  question: Which products had higher revenue in 2025 than in 2024? Show both years.
  sql: |-
    SELECT p.product_name,
           ROUND(SUM(CASE WHEN d.year = 2024 THEN s.revenue ELSE 0 END), 2) AS revenue_2024,
           ROUND(SUM(CASE WHEN d.year = 2025 THEN s.revenue ELSE 0 END), 2) AS revenue_2025
    FROM fact_sales s
    JOIN dim_product p ON s.product_id = p.product_id
    JOIN dim_date d ON s.date_id = d.date_id
    GROUP BY p.product_name
    HAVING SUM(CASE WHEN d.year = 2025 THEN s.revenue ELSE 0 END) > SUM(CASE WHEN d.year = 2024 THEN s.revenue ELSE 0 END)
    ORDER BY p.product_name
- id: h06
  difficulty: hard
  question: For each HCP tier, who are the top 2 HCPs by total revenue?
  sql: |-
    WITH hcp_rev AS (
      SELECT h.tier, h.hcp_id, h.hcp_name, SUM(s.revenue) AS total_revenue
      FROM fact_sales s
      JOIN dim_hcp h ON s.hcp_id = h.hcp_id
      GROUP BY h.tier, h.hcp_id, h.hcp_name
    ), ranked AS (
      SELECT tier, hcp_id, hcp_name, total_revenue,
             ROW_NUMBER() OVER (PARTITION BY tier ORDER BY total_revenue DESC, hcp_id) AS rn
      FROM hcp_rev
    )
    SELECT tier, hcp_name, ROUND(total_revenue, 2) AS total_revenue
    FROM ranked
    WHERE rn <= 2
    ORDER BY tier, rn
- id: h07
  difficulty: hard
  question: What percentage of total revenue does each region contribute?
  sql: |-
    WITH region_rev AS (
      SELECT t.region, SUM(s.revenue) AS revenue
      FROM fact_sales s
      JOIN dim_hcp h ON s.hcp_id = h.hcp_id
      JOIN dim_territory t ON h.territory_id = t.territory_id
      GROUP BY t.region
    )
    SELECT region, ROUND(revenue, 2) AS revenue, ROUND(100.0 * revenue / SUM(revenue) OVER (), 2) AS pct_of_total
    FROM region_rev
    ORDER BY region
- id: h08
  difficulty: hard
  question: How many HCPs had sales in 2025 but received no calls in 2025?
  sql: |-
    SELECT COUNT(DISTINCT s.hcp_id) AS hcp_count
    FROM fact_sales s
    JOIN dim_date d ON s.date_id = d.date_id
    WHERE d.year = 2025
      AND NOT EXISTS (
        SELECT 1
        FROM fact_calls c
        JOIN dim_date d2 ON c.date_id = d2.date_id
        WHERE c.hcp_id = s.hcp_id AND d2.year = 2025
      )
- id: h09
  difficulty: hard
  question: For each region in 2025, what is the revenue per call (total revenue divided by total calls)?
  sql: |-
    WITH rev AS (
      SELECT t.region, SUM(s.revenue) AS revenue
      FROM fact_sales s
      JOIN dim_hcp h ON s.hcp_id = h.hcp_id
      JOIN dim_territory t ON h.territory_id = t.territory_id
      JOIN dim_date d ON s.date_id = d.date_id
      WHERE d.year = 2025
      GROUP BY t.region
    ), calls AS (
      SELECT t.region, COUNT(*) AS call_count
      FROM fact_calls c
      JOIN dim_hcp h ON c.hcp_id = h.hcp_id
      JOIN dim_territory t ON h.territory_id = t.territory_id
      JOIN dim_date d ON c.date_id = d.date_id
      WHERE d.year = 2025
      GROUP BY t.region
    )
    SELECT rev.region, ROUND(rev.revenue / calls.call_count, 2) AS revenue_per_call
    FROM rev
    JOIN calls ON rev.region = calls.region
    ORDER BY rev.region
- id: h10
  difficulty: hard
  question: In which month did each product have its highest revenue?
  sql: |-
    WITH monthly AS (
      SELECT p.product_name, s.date_id, SUM(s.revenue) AS revenue
      FROM fact_sales s
      JOIN dim_product p ON s.product_id = p.product_id
      GROUP BY p.product_name, s.date_id
    ), ranked AS (
      SELECT product_name, date_id, revenue,
             RANK() OVER (PARTITION BY product_name ORDER BY revenue DESC) AS rnk
      FROM monthly
    )
    SELECT product_name, date_id, ROUND(revenue, 2) AS revenue
    FROM ranked
    WHERE rnk = 1
    ORDER BY product_name
